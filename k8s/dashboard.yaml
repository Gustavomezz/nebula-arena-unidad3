apiVersion: v1
kind: ConfigMap
metadata:
  name: nebula-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  nebula.json: '{"title": "Nebula Arena", "uid": "nebula-arena", "schemaVersion":
    39, "version": 1, "refresh": "5s", "time": {"from": "now-30m", "to": "now"}, "timezone":
    "browser", "panels": [{"id": 1, "title": "Jugadores conectados", "type": "timeseries",
    "gridPos": {"x": 0, "y": 0, "w": 12, "h": 9}, "datasource": {"type": "prometheus",
    "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "sum(nebula_players_connected)",
    "refId": "A", "legendFormat": "Jugadores conectados"}], "fieldConfig": {"defaults":
    {"unit": "short"}, "overrides": []}, "options": {"legend": {"displayMode": "list",
    "placement": "bottom"}}}, {"id": 2, "title": "Duración del tick p99", "type":
    "timeseries", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 9}, "datasource": {"type":
    "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "histogram_quantile(0.99,sum
    by(le)(rate(nebula_tick_seconds_bucket[1m])))*1000", "refId": "A", "legendFormat":
    "Duración del tick p99"}], "fieldConfig": {"defaults": {"unit": "ms"}, "overrides":
    []}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}}}, {"id":
    3, "title": "Servidores por estado", "type": "timeseries", "gridPos": {"x": 0,
    "y": 9, "w": 12, "h": 9}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
    "targets": [{"expr": "sum by(type)(agones_gameservers_count{fleet_name=\"nebula-fleet\"})",
    "refId": "A", "legendFormat": "{{type}}"}], "fieldConfig": {"defaults": {"unit":
    "short"}, "overrides": []}, "options": {"legend": {"displayMode": "list", "placement":
    "bottom"}}}, {"id": 4, "title": "Nodos del clúster", "type": "timeseries", "gridPos":
    {"x": 12, "y": 9, "w": 12, "h": 9}, "datasource": {"type": "prometheus", "uid":
    "${DS_PROMETHEUS}"}, "targets": [{"expr": "count(kube_node_info)", "refId": "A",
    "legendFormat": "Nodos del clúster"}], "fieldConfig": {"defaults": {"unit": "short"},
    "overrides": []}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}}},
    {"id": 5, "title": "Tick efectivo por servidor", "type": "timeseries", "gridPos":
    {"x": 0, "y": 18, "w": 12, "h": 9}, "datasource": {"type": "prometheus", "uid":
    "${DS_PROMETHEUS}"}, "targets": [{"expr": "avg(rate(nebula_ticks_total[1m]))",
    "refId": "A", "legendFormat": "Tick efectivo por servidor"}], "fieldConfig": {"defaults":
    {"unit": "hertz"}, "overrides": []}, "options": {"legend": {"displayMode": "list",
    "placement": "bottom"}}}, {"id": 6, "title": "Pods de matchmaking", "type": "timeseries",
    "gridPos": {"x": 12, "y": 18, "w": 12, "h": 9}, "datasource": {"type": "prometheus",
    "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "count(kube_pod_info{pod=~\"matchmaker-.*\"})",
    "refId": "A", "legendFormat": "Pods de matchmaking"}], "fieldConfig": {"defaults":
    {"unit": "short"}, "overrides": []}, "options": {"legend": {"displayMode": "list",
    "placement": "bottom"}}}], "templating": {"list": [{"name": "DS_PROMETHEUS", "type":
    "datasource", "query": "prometheus", "current": {"text": "Prometheus", "value":
    "prometheus"}}]}}'
